[package]
name = "tensortailor-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "llmfit's fit and speed math, callable from WebAssembly for TensorTailor"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine itself: llmfit by Alex Jones (MIT). Pinned to a release tag;
# keep LLMFIT_REF in src/lib.rs in step with this tag.
llmfit-core = { git = "https://github.com/AlexsJones/llmfit", tag = "v1.1.20" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
# llmfit-core pulls in getrandom through its network crates. In a browser it
# needs the JavaScript random source; .cargo/config.toml sets the 0.3 backend.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
