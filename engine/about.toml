# cargo-about: lists the licenses of every Rust crate inside the WebAssembly engine.
# The build action runs it for the wasm32 target (the crates that are really in the page).
# A crate with a license that is not in this list stops the build, so it is checked first.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
]
targets = ["wasm32-unknown-unknown"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
