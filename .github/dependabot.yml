# Dependabot keeps the GitHub Actions up to date: every action is pinned to a commit (other authors' since the deep
# review 2026-11-13, P4; GitHub's own actions/* since 2026-11-15), and Dependabot proposes a new commit when a new
# version comes out.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/build"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
