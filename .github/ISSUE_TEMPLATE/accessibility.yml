name: Accessibility barrier
description: Something stops you from using TensorTailor with a keyboard, a screen reader, zoom or other help.
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. See [ACCESSIBILITY.md](https://github.com/jan-stegeman/tensortailor/blob/main/ACCESSIBILITY.md)
        for what already works and the known limits.
  - type: input
    id: version
    attributes:
      label: TensorTailor version
      description: At the top left of the page, under the name.
      placeholder: v2026.11.17
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What did you try to do?
      placeholder: I wanted to open the Files tab of a model with only the keyboard.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
      description: For example a control you cannot reach, text you cannot read, or something the screen reader does not say.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Browser and assistive technology
      description: Browser, operating system, and for example the screen reader or zoom level you use.
      placeholder: Chrome on Windows 11, NVDA, zoom 150 %
    validations:
      required: true
