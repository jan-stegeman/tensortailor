name: Build TensorTailor
description: >
  Native llmfit run (golden answers), WebAssembly build, check that both give the
  same answers, and the single-file page in dist/tensortailor.html.
  Used by engine.yml (every push) and weekly.yml (Tuesday release).

inputs:
  catalog_file:
    description: >
      Optional hf_models.json to build with (our weekly catalog). Empty = the
      catalog of the llmfit tag. With a file, the native golden run is built
      from the same patched copy, so both sides embed the same catalog.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Rust with the WebAssembly target
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Rust builds
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: engine

    - name: Check that the llmfit tag matches LLMFIT_REF
      shell: bash
      working-directory: engine
      run: |
        TAG=$(grep -oP 'tag = "\K[^"]+' Cargo.toml)
        REF=$(grep -oP 'LLMFIT_REF: &str = "\K[^"]+' src/lib.rs)
        echo "Cargo.toml tag: $TAG, lib.rs LLMFIT_REF: $REF"
        test "$TAG" = "$REF"

    - name: Make a browser-ready copy of llmfit-core (clock fix, live models)
      shell: bash
      working-directory: engine
      run: bash tools/patch-llmfit.sh "$GITHUB_WORKSPACE/vendor/llmfit"

    # With the tag's own catalog: these tests check the patch, not the data.
    - name: llmfit's own tests on the patched copy
      shell: bash
      working-directory: vendor/llmfit
      run: "cargo test --release -p llmfit-core --lib -- update:: models::"

    - name: Use our weekly catalog
      if: inputs.catalog_file != ''
      shell: bash
      env:
        CATALOG_FILE: ${{ inputs.catalog_file }}
      run: |
        set -euo pipefail
        python3 -m json.tool "$CATALOG_FILE" > /dev/null
        cp "$CATALOG_FILE" "$GITHUB_WORKSPACE/vendor/llmfit/llmfit-core/data/hf_models.json"
        echo "Built with our weekly catalog: $(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$CATALOG_FILE") entries" | tee -a "$GITHUB_STEP_SUMMARY"

    # The original llmfit-core with only one change, the same as in the browser copy: no localmaxxing.com
    # benchmark cache (tools/strip-benchmark-cache.sh). Golden answers from it prove that the browser patch
    # changes no answer.
    - name: Original llmfit-core without localmaxxing's cache (for the golden answers)
      shell: bash
      working-directory: engine
      run: |
        set -euo pipefail
        TAG=$(grep -oP 'tag = "\K[^"]+' Cargo.toml)
        rm -rf "$GITHUB_WORKSPACE/vendor/llmfit-golden"
        git clone --quiet --depth 1 --branch "$TAG" https://github.com/AlexsJones/llmfit "$GITHUB_WORKSPACE/vendor/llmfit-golden"
        bash tools/strip-benchmark-cache.sh "$GITHUB_WORKSPACE/vendor/llmfit-golden"

    - name: Native run (golden answers)
      shell: bash
      working-directory: engine
      env:
        OWN_CATALOG: ${{ inputs.catalog_file }}
      run: |
        set -euo pipefail
        if [ -n "$OWN_CATALOG" ]; then
          # Same patched copy as the WebAssembly build, so both embed our catalog.
          cargo run --release --example golden \
            --config "patch.\"https://github.com/AlexsJones/llmfit\".llmfit-core.path=\"$GITHUB_WORKSPACE/vendor/llmfit/llmfit-core\"" \
            -- golden-native.json
        else
          # The original llmfit-core (only the benchmark cache left out): proves the patch changes no answer.
          cargo run --release --example golden \
            --config "patch.\"https://github.com/AlexsJones/llmfit\".llmfit-core.path=\"$GITHUB_WORKSPACE/vendor/llmfit-golden/llmfit-core\"" \
            -- golden-native.json
        fi

    - name: Native run of the live-model functions (patched copy)
      shell: bash
      working-directory: engine
      run: >
        cargo run --release --features live --example mapcheck
        --config "patch.\"https://github.com/AlexsJones/llmfit\".llmfit-core.path=\"$GITHUB_WORKSPACE/vendor/llmfit/llmfit-core\""
        -- tools/hf-fixtures.json mapcheck-native.json

    - name: Build WebAssembly
      shell: bash
      working-directory: engine
      run: >
        cargo build --release --target wasm32-unknown-unknown --lib --features live
        --config "patch.\"https://github.com/AlexsJones/llmfit\".llmfit-core.path=\"$GITHUB_WORKSPACE/vendor/llmfit/llmfit-core\""

    - name: Install wasm-bindgen CLI (same version as the crate)
      shell: bash
      working-directory: engine
      run: |
        V=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
        echo "wasm-bindgen $V"
        cargo install wasm-bindgen-cli --version "$V" --locked

    - name: Make the JavaScript bindings
      shell: bash
      working-directory: engine
      run: |
        WASM=target/wasm32-unknown-unknown/release/tensortailor_engine.wasm
        wasm-bindgen --target nodejs --out-dir pkg-node "$WASM"
        wasm-bindgen --target web --out-dir pkg-web "$WASM"
        wasm-bindgen --target no-modules --out-dir pkg-nomod "$WASM"

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Compare WebAssembly with native
      shell: bash
      working-directory: engine
      run: node tools/compare.mjs golden-native.json mapcheck-native.json

    - name: Size report
      shell: bash
      working-directory: engine
      run: |
        gzip -9 -k pkg-web/tensortailor_engine_bg.wasm
        ls -l pkg-web
        {
          echo "## Engine size"
          echo '```'
          ls -l pkg-web
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Install cargo-about
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-about

    # The licenses of every Rust crate in the WebAssembly engine, with their texts. Uses the same patched
    # llmfit-core as the WebAssembly build (the patch adds the web-time crate), through a temporary
    # [patch] in .cargo/config.toml; both that file and Cargo.lock are restored afterwards.
    - name: Third-party notices (cargo-about, wasm32 target)
      shell: bash
      working-directory: engine
      run: |
        set -euo pipefail
        printf '\n[patch."https://github.com/AlexsJones/llmfit"]\nllmfit-core = { path = "%s" }\n' "$GITHUB_WORKSPACE/vendor/llmfit/llmfit-core" >> .cargo/config.toml
        mkdir -p ../dist
        status=0
        cargo about generate --features live about.hbs -o ../dist/THIRD-PARTY-NOTICES.txt || status=$?
        git checkout -- .cargo/config.toml Cargo.lock
        test "$status" -eq 0
        grep -q 'serde_json' ../dist/THIRD-PARTY-NOTICES.txt
        echo "Third-party notices: $(grep -c '^Used by:' ../dist/THIRD-PARTY-NOTICES.txt) license texts, $(wc -c < ../dist/THIRD-PARTY-NOTICES.txt) bytes" | tee -a "$GITHUB_STEP_SUMMARY"

    # Hugging Face's list of gated models (about 60 pages, under a minute), only the catalog's names kept.
    # If Hugging Face cannot be reached, the page is built without it and guesses "gated" from the license
    # name, as before: a warning, not a failure.
    - name: Gated list from Hugging Face
      shell: bash
      run: |
        node tools/fetch-gated.mjs vendor/llmfit/llmfit-core/data/hf_models.json dist/gated.json | tee -a "$GITHUB_STEP_SUMMARY" \
          || { echo "::warning::No gated list: the page guesses gated from the license name"; rm -f dist/gated.json; }

    - name: Build the single-file page
      shell: bash
      run: |
        export TT_COMMIT="$(git rev-parse HEAD)"
        node web/build.mjs engine/pkg-nomod dist/tensortailor.html vendor/llmfit/llmfit-core/data/hf_models.json
