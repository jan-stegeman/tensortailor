name: Weekly release

# Every Tuesday: follow the newest llmfit release, build, check that the
# WebAssembly engine gives the same answers as native llmfit, and publish the
# single HTML file as a GitHub Release. Nothing is pushed or released when a
# check fails. No release when nothing that goes into the page changed.
#
# Two jobs, so the write token never shares a machine with llmfit's code:
# - build (contents: read) runs everything that uses llmfit's code (the build,
#   llmfit's tests, the README pictures) and makes its commits only locally. It
#   hands over the page and a git bundle of those commits as artifacts.
# - release (contents: write) runs no llmfit code and no code of this
#   repository. It takes both artifacts by their IDs (download-artifact checks
#   the digest), checks that the page arrived unchanged and that the commits
#   only move the llmfit tag forward (Cargo.toml, lib.rs, Cargo.lock pinned to
#   the commit GitHub names for the tag) and refresh README pictures, then
#   pushes them and publishes the release.
# The build job writes the Rust cache; no job with the write token restores a
# cache, because a job that ran llmfit's code could have put a bad entry there.

on:
  schedule:
    - cron: "0 6 * * 2" # Tuesday 06:00 UTC (llmfit refreshes its catalog on Monday)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: build and check, but no push and no release"
        type: boolean
        default: false
      llmfit_tag:
        description: "Test only: try this llmfit tag (for example v1.1.19). Always a dry run."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      update: ${{ steps.llmfit.outputs.update }}
      dry: ${{ steps.llmfit.outputs.dry }}
      tag: ${{ steps.ver.outputs.tag }}
      built: ${{ steps.built.outputs.sha }}
      page_sha: ${{ steps.built.outputs.page_sha }}
      page_id: ${{ steps.page.outputs.artifact-id }}
      release: ${{ steps.decide.outputs.release }}
      catalog_why: ${{ steps.cat.outputs.why }}
      catalog_sha: ${{ steps.cat.outputs.sha }}
      push: ${{ steps.pack.outputs.push }}
      head: ${{ steps.pack.outputs.head }}
      commits_id: ${{ steps.commits.outputs.artifact-id }}
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Look for a new llmfit release
        id: llmfit
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.llmfit_tag }}
          DRY_INPUT: ${{ inputs.dry_run }}
          BASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The release job pushes on top of this commit, so the build must start from it.
          test "$(git rev-parse HEAD)" = "$BASE"
          CUR=$(grep -oP 'tag = "\K[^"]+' engine/Cargo.toml)
          if [ -n "${WANT:-}" ]; then
            NEW="$WANT"
          else
            NEW=$(gh api repos/AlexsJones/llmfit/releases/latest --jq .tag_name)
          fi
          if ! [[ "$NEW" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected llmfit tag: $NEW"
            exit 1
          fi
          UPDATE=false
          if [ "$NEW" != "$CUR" ]; then
            if [ -n "${WANT:-}" ] || [ "$(printf '%s\n%s\n' "$CUR" "$NEW" | sort -V | tail -n1)" = "$NEW" ]; then
              UPDATE=true
            fi
          fi
          DRY=false
          if [ "${DRY_INPUT:-false}" = "true" ] || [ -n "${WANT:-}" ]; then DRY=true; fi
          {
            echo "current=$CUR"
            echo "new=$NEW"
            echo "update=$UPDATE"
            echo "dry=$DRY"
          } >> "$GITHUB_OUTPUT"
          echo "llmfit: we use $CUR, newest is $NEW. Update: $UPDATE. Dry run: $DRY." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Rust (for the lock file update)
        if: steps.llmfit.outputs.update == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-13
        with:
          toolchain: stable

      - name: Switch the engine to the new llmfit tag (local commit, pushed only after all checks)
        if: steps.llmfit.outputs.update == 'true'
        env:
          CUR: ${{ steps.llmfit.outputs.current }}
          NEW: ${{ steps.llmfit.outputs.new }}
        run: |
          set -euo pipefail
          sed -i "s/tag = \"$CUR\"/tag = \"$NEW\"/" engine/Cargo.toml
          sed -i "s/LLMFIT_REF: &str = \"$CUR\"/LLMFIT_REF: \\&str = \"$NEW\"/" engine/src/lib.rs
          grep -q "tag = \"$NEW\"" engine/Cargo.toml
          grep -q "LLMFIT_REF: &str = \"$NEW\"" engine/src/lib.rs
          (cd engine && cargo update -p llmfit-core)
          grep -q "llmfit?tag=$NEW#" engine/Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git add engine/Cargo.toml engine/Cargo.lock engine/src/lib.rs
          git commit -m "chore(engine): follow llmfit $NEW" -m "Weekly run: same answers as native llmfit checked before the push."
          git --no-pager show --stat HEAD

      # Our weekly catalog (catalog.yml, Monday) when it is fresh and intact,
      # else llmfit's own catalog of the tag. The release job accepts only these four "why" texts (WHY_RE).
      - name: Choose the model catalog
        id: cat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p catalog
          FILE=""; SHA=""; WHY="llmfit's own catalog of the tag (no weekly catalog found)"
          if gh release download catalog -D catalog -p hf_models.json -p catalog-info.json 2>/dev/null; then
            eval "$(python3 - <<'PY'
          import datetime, hashlib, json
          info = json.load(open("catalog/catalog-info.json"))
          sha = hashlib.sha256(open("catalog/hf_models.json", "rb").read()).hexdigest()
          built = datetime.datetime.strptime(info["built"], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=datetime.timezone.utc)
          age = (datetime.datetime.now(datetime.timezone.utc) - built).days
          print(f'OK={"yes" if sha == info["sha256"] else "no"} AGE={age} N={int(info["models"])} BUILT={info["built"][:10]} CSHA={sha}')
          PY
          )"
            if [ "$OK" = yes ] && [ "$AGE" -le 8 ]; then
              FILE="$GITHUB_WORKSPACE/catalog/hf_models.json"; SHA="$CSHA"
              WHY="our weekly catalog of $BUILT ($N entries, made with llmfit's own scraper)"
            elif [ "$OK" != yes ]; then WHY="llmfit's own catalog of the tag (our weekly catalog failed its SHA-256 check)"
            else WHY="llmfit's own catalog of the tag (our weekly catalog is $AGE days old)"; fi
          fi
          { echo "file=$FILE"; echo "sha=$SHA"; echo "why=$WHY"; } >> "$GITHUB_OUTPUT"
          echo "Model list: $WHY" | tee -a "$GITHUB_STEP_SUMMARY"

      # The version is chosen before the build, so the page can show it (top left, About). It is the release tag:
      # vYYYY.MM.DD, or vYYYY.MM.DD-2, -3 … when that day already has a release.
      - name: Choose the version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DAY=$(date -u +%Y.%m.%d)
          TAG="v$DAY"
          n=2
          while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || gh release view "$TAG" >/dev/null 2>&1; do
            TAG="v$DAY-$n"; n=$((n + 1))
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $TAG" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build, compare with native llmfit, make the page
        uses: ./.github/actions/build
        with:
          catalog_file: ${{ steps.cat.outputs.file }}
          version: ${{ steps.ver.outputs.tag }}

      # The commit the page was built from: the release points at it (the README picture commit that may
      # follow changes only docs/). The SHA-256 of the page lets the release job check what it receives.
      - name: Remember the built commit
        id: built
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "page_sha=$(sha256sum dist/tensortailor.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # The build action restores Cargo.lock after its patched builds (they add the web-time crate), so a
      # "did not change" check here would prove nothing. What counts: Cargo.lock names the tag, and the build
      # stopped if the cloned llmfit is not the commit Cargo.lock names (patch-llmfit.sh).
      - name: Check that Cargo.lock names the llmfit tag
        run: |
          TAG=$(grep -oP 'tag = "\K[^"]+' engine/Cargo.toml)
          grep -q "llmfit?tag=$TAG#" engine/Cargo.lock

      - name: Keep the page
        id: page
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tensortailor-html-weekly
          path: |
            dist/tensortailor.html
            dist/THIRD-PARTY-NOTICES.txt
          retention-days: 30
          if-no-files-found: error

      - name: Decide on a release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE: ${{ steps.llmfit.outputs.update }}
          DRY: ${{ steps.llmfit.outputs.dry }}
          CATALOG_SHA: ${{ steps.cat.outputs.sha }}
        run: |
          set -euo pipefail
          LAST=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')
          LAST_CATALOG=""
          if [ -n "$LAST" ]; then LAST_CATALOG=$(gh release view "$LAST" --json body --jq .body | grep -oP 'Catalog SHA-256: `\K[0-9a-f]{64}' || true); fi
          RELEASE=true
          WHY="new build"
          if [ "$DRY" = "true" ]; then
            RELEASE=false; WHY="dry run"
          elif [ "$UPDATE" != "true" ] && [ -n "$LAST" ] && [ "$CATALOG_SHA" = "$LAST_CATALOG" ] && git diff --quiet "$LAST" HEAD -- engine web .github/actions; then
            RELEASE=false; WHY="nothing in engine/, web/, the build or the catalog changed since $LAST"
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Release: $RELEASE ($WHY). Last release: ${LAST:-none}." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Refresh README demo screenshots
        id: shots
        if: steps.decide.outputs.release == 'true' && steps.llmfit.outputs.dry != 'true'
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)
          # The test runner reads the browser's port from DevToolsActivePort in its profile folder; a snap Chromium
          # cannot write into /tmp as Node sees it, so the profiles go under the runner's own temp folder.
          export CDP_PROFILE_DIR="$RUNNER_TEMP/tt-profiles"
          CHANGED=false
          if [ -z "$CHROME" ]; then
            echo "::warning::Chrome not found on runner; keeping existing README screenshots"
          elif shots() { out=$(node tools/cdp_test.mjs "$CHROME" "file://$GITHUB_WORKSPACE/dist/tensortailor.html" "/tmp/tt-last.png" "state.ready && state.results.length > 0" tools/readme-screenshots.json 2>&1) && [ "$(printf '%s\n' "$out" | grep -c '^screenshot: docs/screenshots/')" -eq 12 ]; }; shots || { echo "First try failed, trying once more."; git checkout -- docs/screenshots; shots; }; then
            if ! git diff --quiet -- docs/screenshots; then
              git config user.name "github-actions[bot]"
              git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
              git add docs/screenshots
              git commit -m "docs(screenshots): refresh README demo screenshots for weekly release"
              CHANGED=true
              echo "Refreshed 12 README demo screenshots." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "README demo screenshots already up to date." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Screenshot refresh failed; keeping existing README screenshots"
            printf '%s\n' "${out:-}" | tail -n 30
            git checkout -- docs/screenshots
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      # The local commits (engine update, README pictures) go to the release job as a git bundle; that job
      # pushes them. A dry run hands over nothing.
      - name: Pack the new commits for the release job
        id: pack
        if: steps.llmfit.outputs.dry != 'true'
        env:
          BASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" = "$BASE" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/handover"
          git branch -f weekly-out HEAD
          git bundle create "$RUNNER_TEMP/handover/weekly.bundle" refs/heads/weekly-out "^$BASE"
          { echo "push=true"; echo "head=$HEAD_SHA"; } >> "$GITHUB_OUTPUT"
          echo "New commits for main:" | tee -a "$GITHUB_STEP_SUMMARY"
          git --no-pager log --format='%h %s' "$BASE..HEAD" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Hand the commits to the release job
        id: commits
        if: steps.pack.outputs.push == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-commits
          path: ${{ runner.temp }}/handover/weekly.bundle
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.dry != 'true' && (needs.build.outputs.release == 'true' || needs.build.outputs.push == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Only git, gh and the runner's own python3 (-I, standard library) run in this job; nothing of this
      # checkout is started.
      - name: Checkout (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Take the page of the build job (by ID; the digest is checked)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.page_id }}
          path: ${{ runner.temp }}/page
          digest-mismatch: error

      - name: Take the new commits of the build job (by ID; the digest is checked)
        if: needs.build.outputs.push == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.commits_id }}
          path: ${{ runner.temp }}/commits
          digest-mismatch: error

      # The build job ran llmfit's code, so what it hands over is checked here before anything is pushed or
      # published: the page is the file it built, and its commits are a straight line on top of this run's
      # commit that change only the llmfit tag lines, Cargo.lock and the README pictures.
      - name: Check what the build job handed over
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.sha }}
          BUILD_UPDATE: ${{ needs.build.outputs.update }}
          PUSH: ${{ needs.build.outputs.push }}
          HEAD_SHA: ${{ needs.build.outputs.head }}
          BUILT: ${{ needs.build.outputs.built }}
          PAGE_SHA: ${{ needs.build.outputs.page_sha }}
          TAG: ${{ needs.build.outputs.tag }}
          CATALOG_SHA: ${{ needs.build.outputs.catalog_sha }}
          CATALOG_WHY: ${{ needs.build.outputs.catalog_why }}
          PAGE_DIR: ${{ runner.temp }}/page
          BUNDLE: ${{ runner.temp }}/commits/weekly.bundle
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "$BUILT" =~ ^[0-9a-f]{40}$ ]] || fail "Bad built commit from the build job."
          [[ "$PAGE_SHA" =~ ^[0-9a-f]{64}$ ]] || fail "Bad page SHA-256 from the build job."
          [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$ ]] || fail "Bad version from the build job: $TAG"
          [[ -z "$CATALOG_SHA" || "$CATALOG_SHA" =~ ^[0-9a-f]{64}$ ]] || fail "Bad catalog SHA-256 from the build job."
          # Exactly the four texts of the build job's step "Choose the model catalog" (keep both in step).
          WHY_RE="^(llmfit's own catalog of the tag \((no weekly catalog found|our weekly catalog failed its SHA-256 check|our weekly catalog is -?[0-9]+ days old)\)|our weekly catalog of [0-9]{4}-[0-9]{2}-[0-9]{2} \(-?[0-9]+ entries, made with llmfit's own scraper\))$"
          [[ "$CATALOG_WHY" =~ $WHY_RE ]] || fail "Bad catalog text from the build job."

          # The page artifact: exactly these two plain files, and the page the build job took the SHA-256 of.
          FILES=$(cd "$PAGE_DIR" && find . -mindepth 1 -printf '%P %y\n' | LC_ALL=C sort)
          [ "$FILES" = "$(printf 'THIRD-PARTY-NOTICES.txt f\ntensortailor.html f')" ] || fail "Unexpected files in the page artifact: $FILES"
          [ "$(sha256sum "$PAGE_DIR/tensortailor.html" | cut -d' ' -f1)" = "$PAGE_SHA" ] || fail "tensortailor.html is not the page the build job made."

          if [ "$PUSH" = "true" ]; then
            [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "Bad head commit from the build job."
            git bundle verify -q "$BUNDLE" || fail "The commit bundle does not fit on $BASE."
            [ "$(git bundle list-heads "$BUNDLE" | wc -l)" -eq 1 ] || fail "The commit bundle must hold one branch."
            git -c fetch.fsckObjects=true fetch -q "$BUNDLE" refs/heads/weekly-out
            [ "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA" ] || fail "The commit bundle is not the head the build job named."
            # New commits, each with one parent, on top of BASE. The page is built from BASE (then there is exactly
            # one commit: the README pictures) or from the first new commit (the engine update, maybe followed by
            # one commit that changes only README pictures).
            mapfile -t NEWC < <(git rev-list --reverse "$BASE..$HEAD_SHA")
            if [ "$BUILT" = "$BASE" ]; then
              [ "${#NEWC[@]}" -eq 1 ] || fail "Without an engine update, expected 1 new commit, got ${#NEWC[@]}."
            else
              { [ "${#NEWC[@]}" -ge 1 ] && [ "${#NEWC[@]}" -le 2 ]; } || fail "Expected 1 or 2 new commits, got ${#NEWC[@]}."
              [ "$BUILT" = "${NEWC[0]}" ] || fail "The built commit $BUILT is not the first new commit."
            fi
            PREV=$BASE
            for C in "${NEWC[@]}"; do
              [ "$(git rev-list --parents -n1 "$C")" = "$C $PREV" ] || fail "Commit $C is not a straight child of $PREV."
              CHANGES=$(git diff-tree -r --no-renames "$PREV" "$C")
              [ -n "$CHANGES" ] || fail "Commit $C changes nothing."
              while IFS=$'\t' read -r META FILE; do
                read -r _ MODE _ _ STATUS <<< "$META"
                [ "$MODE" = "100644" ] || fail "Commit $C gives $FILE the mode $MODE."
                if [ "$C" = "$BUILT" ]; then
                  case "$FILE" in
                    engine/Cargo.toml|engine/Cargo.lock|engine/src/lib.rs) [ "$STATUS" = "M" ] || fail "Commit $C: $FILE is $STATUS." ;;
                    *) fail "The engine commit $C changes $FILE, which it may not change." ;;
                  esac
                else
                  [[ "$FILE" =~ ^docs/screenshots/[A-Za-z0-9._-]+\.png$ && "$STATUS" =~ ^[MA]$ ]] || fail "Commit $C changes $FILE ($STATUS); only README pictures may change there."
                fi
              done <<< "$CHANGES"
              PREV=$C
            done
          else
            [ "$BUILT" = "$BASE" ] || fail "No commits were handed over, so the page must be built from $BASE."
          fi

          # An engine update is what the commits show, and it must agree with what the build job says.
          UPDATE=false; [ "$BUILT" != "$BASE" ] && UPDATE=true
          [ "$UPDATE" = "$BUILD_UPDATE" ] || fail "The build job says update=$BUILD_UPDATE, but the commits say $UPDATE."
          LLMFIT=$(git show "$BUILT:engine/Cargo.toml" | grep -oP 'tag = "\K[^"]+')
          [[ "$LLMFIT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Unexpected llmfit tag in the built commit: $LLMFIT"
          if [ "$UPDATE" = "true" ]; then
            CUR=$(git show "$BASE:engine/Cargo.toml" | grep -oP 'tag = "\K[^"]+')
            NEW=$LLMFIT
            [[ "$CUR" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Unexpected llmfit tag in $BASE: $CUR"
            { [ "$NEW" != "$CUR" ] && [ "$(printf '%s\n%s\n' "$CUR" "$NEW" | sort -V | tail -n1)" = "$NEW" ]; } || fail "The engine update must move the llmfit tag forward ($CUR -> $NEW)."
            # Cargo.toml and lib.rs: the old files with only the tag changed, by the same edits as the build job.
            cmp -s <(git show "$BASE:engine/Cargo.toml" | sed "s/tag = \"$CUR\"/tag = \"$NEW\"/") <(git show "$BUILT:engine/Cargo.toml") \
              || fail "engine/Cargo.toml changes more than the llmfit tag ($CUR -> $NEW)."
            cmp -s <(git show "$BASE:engine/src/lib.rs" | sed "s/LLMFIT_REF: &str = \"$CUR\"/LLMFIT_REF: \\&str = \"$NEW\"/") <(git show "$BUILT:engine/src/lib.rs") \
              || fail "engine/src/lib.rs changes more than LLMFIT_REF ($CUR -> $NEW)."
            git show "$BUILT:engine/src/lib.rs" | grep -qxF "pub const LLMFIT_REF: &str = \"$NEW\";" || fail "engine/src/lib.rs does not name llmfit $NEW."
            # Cargo.lock, compared with the one of BASE: every llmfit crate at the commit that GitHub names for the
            # TAG (tags/, never a branch of that name); our own crates (no source) unchanged; every other crate from
            # crates.io with a checksum (the same checksum when the version was there before); no crate lower than
            # before inside a semver line that BASE had. A real llmfit update that lowers a crate inside its line
            # therefore stops here: check it by hand.
            LSHA=$(gh api "repos/AlexsJones/llmfit/commits/tags/$NEW" --jq .sha)
            [[ "$LSHA" =~ ^[0-9a-f]{40}$ ]] || fail "GitHub gave no commit for the llmfit tag $NEW."
            git show "$BASE:engine/Cargo.lock" > "$RUNNER_TEMP/base.lock"
            git show "$BUILT:engine/Cargo.lock" > "$RUNNER_TEMP/built.lock"
            python3 -I - "$RUNNER_TEMP/base.lock" "$RUNNER_TEMP/built.lock" "git+https://github.com/AlexsJones/llmfit?tag=$NEW#$LSHA" <<'PY' \
              || fail "Cargo.lock does not pass the check for llmfit $NEW at $LSHA (see the line above)."
          import re, sys, tomllib
          base_path, built_path, want = sys.argv[1:4]
          CRATES = "registry+https://github.com/rust-lang/crates.io-index"
          LLMFIT = "git+https://github.com/AlexsJones/llmfit?"

          def load(path):
              with open(path, "rb") as f:
                  lock = tomllib.load(f)
              if set(lock) != {"version", "package"}:
                  sys.exit(f"Cargo.lock has unexpected top-level keys: {sorted(lock)}")
              return lock

          def vkey(version):
              # shortcut: pre-release parts compare as plain text; enough for the release crates in this lock,
              # refine when a pre-release crate shows up.
              core, _, pre = version.split("+")[0].partition("-")
              return (tuple(int(n) for n in core.split(".")), pre == "", pre)

          base, built = load(base_path), load(built_path)
          if built["version"] != base["version"]:
              sys.exit(f"Cargo.lock format changed: {base['version']} -> {built['version']}")
          base_reg = {}
          for p in base["package"]:
              if p.get("source") == CRATES:
                  base_reg.setdefault(p["name"], {})[p["version"]] = p.get("checksum")
          base_local = sorted((p["name"], p["version"]) for p in base["package"] if "source" not in p)
          built_reg, built_local, llmfit, seen = {}, [], [], set()
          for p in built["package"]:
              name, ver, src = p["name"], p["version"], p.get("source")
              if (name, ver, src) in seen:
                  sys.exit(f"Cargo.lock lists {name} {ver} twice.")
              seen.add((name, ver, src))
              if src is None:
                  built_local.append((name, ver))
              elif src.startswith(LLMFIT):
                  if src != want:
                      sys.exit(f"Cargo.lock: {name} {ver} comes from {src}, not from {want}.")
                  llmfit.append(name)
              elif src == CRATES:
                  checksum = p.get("checksum")
                  if not isinstance(checksum, str) or not re.fullmatch(r"[0-9a-f]{64}", checksum):
                      sys.exit(f"Cargo.lock: {name} {ver} has no valid checksum.")
                  old = base_reg.get(name, {}).get(ver)
                  if old is not None and old != checksum:
                      sys.exit(f"Cargo.lock: the checksum of {name} {ver} changed.")
                  built_reg.setdefault(name, {})[ver] = checksum
              else:
                  sys.exit(f"Cargo.lock: {name} {ver} comes from {src}; only crates.io and llmfit are allowed.")
          if "llmfit-core" not in llmfit:
              sys.exit("Cargo.lock has no llmfit-core from the llmfit tag.")
          if sorted(built_local) != base_local:
              sys.exit(f"Cargo.lock: our own crates changed: {base_local} -> {sorted(built_local)}")
          # Per semver line (1.x, 0.4.x, 0.0.3 …): a crate may gain or lose a whole line, but inside a line that
          # BASE had, the version must not be lower than BASE's.
          # shortcut: a requirement that spans lines (such as ">=0.4, <0.6") can still swap 0.5.x for a lower
          # 0.4.x; not checked, because a stricter rule would also refuse rare real updates. Upgrade when such a
          # requirement shows up in our dependency tree.
          def line(version):
              major, minor, patch = vkey(version)[0]
              return (major,) if major else (0, minor) if minor else (0, 0, patch)

          for name, versions in built_reg.items():
              top = {}
              for v in base_reg.get(name, {}):
                  top[line(v)] = max(top.get(line(v), vkey(v)), vkey(v))
              for v in versions:
                  if line(v) in top and vkey(v) < top[line(v)]:
                      sys.exit(f"Cargo.lock moves {name} back: {sorted(base_reg[name])} -> {sorted(versions)}")
          print(f"Cargo.lock: {len(seen)} crates; llmfit at the tag, crates.io with checksums, no crate moved back in its line.")
          PY
          fi
          { echo "llmfit=$LLMFIT"; echo "update=$UPDATE"; } >> "$GITHUB_OUTPUT"
          echo "Hand-over checked: page SHA-256 $PAGE_SHA, built from ${BUILT:0:7}, llmfit $LLMFIT." | tee -a "$GITHUB_STEP_SUMMARY"

      # No rebase: a rebase would put commits into main that are not in the built page, and the next run would
      # then see "nothing new". If main moved during this run, an engine update fails the run (nothing is
      # released); only new README pictures are skipped with a warning (the next run makes them again).
      # Git hooks are switched off for the push.
      - name: Push weekly updates to main
        if: needs.build.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE: ${{ steps.check.outputs.update }}
          HEAD_SHA: ${{ needs.build.outputs.head }}
        run: |
          set -uo pipefail
          if git -c core.hooksPath=/dev/null push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$HEAD_SHA:refs/heads/main"; then
            echo "Pushed to main." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$UPDATE" = "true" ]; then
            echo "::error::main moved during this run, so the engine update could not be pushed. Nothing is released; start the run again."
            exit 1
          else
            echo "::warning::main moved during this run; the new README pictures are not pushed (the next run makes them again)."
          fi

      - name: Publish the release
        if: needs.build.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ needs.build.outputs.built }}
          CATALOG_WHY: ${{ needs.build.outputs.catalog_why }}
          CATALOG_SHA: ${{ needs.build.outputs.catalog_sha }}
          TAG: ${{ needs.build.outputs.tag }}
          LLMFIT: ${{ steps.check.outputs.llmfit }}
          PAGE_DIR: ${{ runner.temp }}/page
        run: |
          set -euo pipefail
          # The page already carries this version: never publish it under another tag.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG appeared during this run; the page says $TAG, so nothing is published."; exit 1
          fi
          (cd "$PAGE_DIR" && sha256sum tensortailor.html > tensortailor.html.sha256)
          SHA=$(cut -d' ' -f1 "$PAGE_DIR/tensortailor.html.sha256")
          SIZE=$(du -m "$PAGE_DIR/tensortailor.html" | cut -f1)
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          One offline HTML file (about $SIZE MB). Download **tensortailor.html** and open it in Edge or Chrome.

          - Version: $TAG (shown at the top left of the page and in About).
          - Engine: llmfit [$LLMFIT](https://github.com/AlexsJones/llmfit/releases/tag/$LLMFIT) by Alex Jones (MIT), compiled to WebAssembly.
            This build gave exactly the same answers as native llmfit.
          - Model list: $CATALOG_WHY.${CATALOG_SHA:+ Catalog SHA-256: \`$CATALOG_SHA\`}
          - Commit: ${BUILT:0:7}
          - SHA-256 of tensortailor.html: \`$SHA\` (also in tensortailor.html.sha256)
          - Licences: TensorTailor and llmfit are MIT. The Rust crates inside the engine and their licences are in
            THIRD-PARTY-NOTICES.txt (also in the page: About → Show the licences).
          EOF
          gh release create "$TAG" "$PAGE_DIR/tensortailor.html" "$PAGE_DIR/tensortailor.html.sha256" "$PAGE_DIR/THIRD-PARTY-NOTICES.txt" \
            --target "$BUILT" \
            --title "TensorTailor ${TAG#v} (llmfit $LLMFIT)" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          echo "Published release $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
