name: Weekly release

# Every Tuesday: follow the newest llmfit release, build, check that the
# WebAssembly engine gives the same answers as native llmfit, and publish the
# single HTML file as a GitHub Release. Nothing is pushed or released when a
# check fails. No release when nothing that goes into the page changed.

on:
  schedule:
    - cron: "0 6 * * 2" # Tuesday 06:00 UTC (llmfit refreshes its catalog on Monday)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: build and check, but no push and no release"
        type: boolean
        default: false
      llmfit_tag:
        description: "Test only: try this llmfit tag (for example v1.1.19). Always a dry run."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  weekly:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The write token is given only to the steps that call gh or push (not to the build, which runs
    # upstream llmfit code and its tests), and checkout does not keep it in .git/config.
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Look for a new llmfit release
        id: llmfit
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.llmfit_tag }}
          DRY_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          CUR=$(grep -oP 'tag = "\K[^"]+' engine/Cargo.toml)
          if [ -n "${WANT:-}" ]; then
            NEW="$WANT"
          else
            NEW=$(gh api repos/AlexsJones/llmfit/releases/latest --jq .tag_name)
          fi
          if ! [[ "$NEW" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected llmfit tag: $NEW"
            exit 1
          fi
          UPDATE=false
          if [ "$NEW" != "$CUR" ]; then
            if [ -n "${WANT:-}" ] || [ "$(printf '%s\n%s\n' "$CUR" "$NEW" | sort -V | tail -n1)" = "$NEW" ]; then
              UPDATE=true
            fi
          fi
          DRY=false
          if [ "${DRY_INPUT:-false}" = "true" ] || [ -n "${WANT:-}" ]; then DRY=true; fi
          {
            echo "current=$CUR"
            echo "new=$NEW"
            echo "update=$UPDATE"
            echo "dry=$DRY"
          } >> "$GITHUB_OUTPUT"
          echo "llmfit: we use $CUR, newest is $NEW. Update: $UPDATE. Dry run: $DRY." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Rust (for the lock file update)
        if: steps.llmfit.outputs.update == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-11-13
        with:
          toolchain: stable

      - name: Switch the engine to the new llmfit tag (local commit, pushed only after all checks)
        if: steps.llmfit.outputs.update == 'true'
        env:
          CUR: ${{ steps.llmfit.outputs.current }}
          NEW: ${{ steps.llmfit.outputs.new }}
        run: |
          set -euo pipefail
          sed -i "s/tag = \"$CUR\"/tag = \"$NEW\"/" engine/Cargo.toml
          sed -i "s/LLMFIT_REF: &str = \"$CUR\"/LLMFIT_REF: \\&str = \"$NEW\"/" engine/src/lib.rs
          grep -q "tag = \"$NEW\"" engine/Cargo.toml
          grep -q "LLMFIT_REF: &str = \"$NEW\"" engine/src/lib.rs
          (cd engine && cargo update -p llmfit-core)
          grep -q "llmfit?tag=$NEW#" engine/Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git add engine/Cargo.toml engine/Cargo.lock engine/src/lib.rs
          git commit -m "chore(engine): follow llmfit $NEW" -m "Weekly run: same answers as native llmfit checked before the push."
          git --no-pager show --stat HEAD

      # Our weekly catalog (catalog.yml, Monday) when it is fresh and intact,
      # else llmfit's own catalog of the tag.
      - name: Choose the model catalog
        id: cat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p catalog
          FILE=""; SHA=""; WHY="llmfit's own catalog of the tag (no weekly catalog found)"
          if gh release download catalog -D catalog -p hf_models.json -p catalog-info.json 2>/dev/null; then
            eval "$(python3 - <<'PY'
          import datetime, hashlib, json
          info = json.load(open("catalog/catalog-info.json"))
          sha = hashlib.sha256(open("catalog/hf_models.json", "rb").read()).hexdigest()
          built = datetime.datetime.strptime(info["built"], "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=datetime.timezone.utc)
          age = (datetime.datetime.now(datetime.timezone.utc) - built).days
          print(f'OK={"yes" if sha == info["sha256"] else "no"} AGE={age} N={int(info["models"])} BUILT={info["built"][:10]} CSHA={sha}')
          PY
          )"
            if [ "$OK" = yes ] && [ "$AGE" -le 8 ]; then
              FILE="$GITHUB_WORKSPACE/catalog/hf_models.json"; SHA="$CSHA"
              WHY="our weekly catalog of $BUILT ($N entries, made with llmfit's own scraper)"
            elif [ "$OK" != yes ]; then WHY="llmfit's own catalog of the tag (our weekly catalog failed its SHA-256 check)"
            else WHY="llmfit's own catalog of the tag (our weekly catalog is $AGE days old)"; fi
          fi
          { echo "file=$FILE"; echo "sha=$SHA"; echo "why=$WHY"; } >> "$GITHUB_OUTPUT"
          echo "Model list: $WHY" | tee -a "$GITHUB_STEP_SUMMARY"

      # The version is chosen before the build, so the page can show it (top left, About). It is the release tag:
      # vYYYY.MM.DD, or vYYYY.MM.DD-2, -3 … when that day already has a release.
      - name: Choose the version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DAY=$(date -u +%Y.%m.%d)
          TAG="v$DAY"
          n=2
          while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || gh release view "$TAG" >/dev/null 2>&1; do
            TAG="v$DAY-$n"; n=$((n + 1))
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $TAG" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build, compare with native llmfit, make the page
        uses: ./.github/actions/build
        with:
          catalog_file: ${{ steps.cat.outputs.file }}
          version: ${{ steps.ver.outputs.tag }}

      # The commit the page was built from: the release points at it (the README picture commit that may
      # follow changes only docs/).
      - name: Remember the built commit
        id: built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The build action restores Cargo.lock after its patched builds (they add the web-time crate), so a
      # "did not change" check here would prove nothing. What counts: Cargo.lock names the tag, and the build
      # stopped if the cloned llmfit is not the commit Cargo.lock names (patch-llmfit.sh).
      - name: Check that Cargo.lock names the llmfit tag
        run: |
          TAG=$(grep -oP 'tag = "\K[^"]+' engine/Cargo.toml)
          grep -q "llmfit?tag=$TAG#" engine/Cargo.lock

      - name: Keep the page
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tensortailor-html-weekly
          path: |
            dist/tensortailor.html
            dist/THIRD-PARTY-NOTICES.txt
          retention-days: 30

      - name: Decide on a release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE: ${{ steps.llmfit.outputs.update }}
          DRY: ${{ steps.llmfit.outputs.dry }}
          CATALOG_SHA: ${{ steps.cat.outputs.sha }}
        run: |
          set -euo pipefail
          LAST=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')
          LAST_CATALOG=""
          if [ -n "$LAST" ]; then LAST_CATALOG=$(gh release view "$LAST" --json body --jq .body | grep -oP 'Catalog SHA-256: `\K[0-9a-f]{64}' || true); fi
          RELEASE=true
          WHY="new build"
          if [ "$DRY" = "true" ]; then
            RELEASE=false; WHY="dry run"
          elif [ "$UPDATE" != "true" ] && [ -n "$LAST" ] && [ "$CATALOG_SHA" = "$LAST_CATALOG" ] && git diff --quiet "$LAST" HEAD -- engine web .github/actions; then
            RELEASE=false; WHY="nothing in engine/, web/, the build or the catalog changed since $LAST"
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Release: $RELEASE ($WHY). Last release: ${LAST:-none}." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Refresh README demo screenshots
        id: shots
        if: steps.decide.outputs.release == 'true' && steps.llmfit.outputs.dry != 'true'
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)
          CHANGED=false
          if [ -z "$CHROME" ]; then
            echo "::warning::Chrome not found on runner; keeping existing README screenshots"
          elif shots() { out=$(node tools/cdp_test.mjs "$CHROME" "file://$GITHUB_WORKSPACE/dist/tensortailor.html" "/tmp/tt-last.png" "state.ready && state.results.length > 0" tools/readme-screenshots.json 2>&1) && [ "$(printf '%s\n' "$out" | grep -c '^screenshot: docs/screenshots/')" -eq 12 ]; }; shots || { echo "First try failed, trying once more."; git checkout -- docs/screenshots; shots; }; then
            if ! git diff --quiet -- docs/screenshots; then
              git config user.name "github-actions[bot]"
              git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
              git add docs/screenshots
              git commit -m "docs(screenshots): refresh README demo screenshots for weekly release"
              CHANGED=true
              echo "Refreshed 12 README demo screenshots." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "README demo screenshots already up to date." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Screenshot refresh failed; keeping existing README screenshots"
            printf '%s\n' "${out:-}" | tail -n 30
            git checkout -- docs/screenshots
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      # No rebase: a rebase would put commits into main that are not in the built page, and the next run would
      # then see "nothing new". If main moved during this run, an engine update fails the run (nothing is
      # released); only new README pictures are skipped with a warning (the next run makes them again).
      - name: Push weekly updates to main
        if: (steps.llmfit.outputs.update == 'true' || steps.shots.outputs.changed == 'true') && steps.llmfit.outputs.dry != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE: ${{ steps.llmfit.outputs.update }}
        run: |
          set -uo pipefail
          if git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then
            echo "Pushed to main." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$UPDATE" = "true" ]; then
            echo "::error::main moved during this run, so the engine update could not be pushed. Nothing is released; start the run again."
            exit 1
          else
            echo "::warning::main moved during this run; the new README pictures are not pushed (the next run makes them again)."
          fi

      - name: Publish the release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ steps.built.outputs.sha }}
          CATALOG_WHY: ${{ steps.cat.outputs.why }}
          CATALOG_SHA: ${{ steps.cat.outputs.sha }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          # The page already carries this version: never publish it under another tag.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG appeared during this run; the page says $TAG, so nothing is published."; exit 1
          fi
          LLMFIT=$(grep -oP 'tag = "\K[^"]+' engine/Cargo.toml)
          (cd dist && sha256sum tensortailor.html > tensortailor.html.sha256)
          SHA=$(cut -d' ' -f1 dist/tensortailor.html.sha256)
          SIZE=$(du -m dist/tensortailor.html | cut -f1)
          cat > release-notes.md <<EOF
          One offline HTML file (about $SIZE MB). Download **tensortailor.html** and open it in Edge or Chrome.

          - Version: $TAG (shown at the top left of the page and in About).
          - Engine: llmfit [$LLMFIT](https://github.com/AlexsJones/llmfit/releases/tag/$LLMFIT) by Alex Jones (MIT), compiled to WebAssembly.
            This build gave exactly the same answers as native llmfit.
          - Model list: $CATALOG_WHY.${CATALOG_SHA:+ Catalog SHA-256: \`$CATALOG_SHA\`}
          - Commit: ${BUILT:0:7}
          - SHA-256 of tensortailor.html: \`$SHA\` (also in tensortailor.html.sha256)
          - Licences: TensorTailor and llmfit are MIT. The Rust crates inside the engine and their licences are in
            THIRD-PARTY-NOTICES.txt (also in the page: About → Show the licences).
          EOF
          gh release create "$TAG" dist/tensortailor.html dist/tensortailor.html.sha256 dist/THIRD-PARTY-NOTICES.txt \
            --target "$BUILT" \
            --title "TensorTailor ${TAG#v} (llmfit $LLMFIT)" \
            --notes-file release-notes.md
          echo "Published release $TAG" | tee -a "$GITHUB_STEP_SUMMARY"
