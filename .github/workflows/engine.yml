name: Engine (WebAssembly)

on:
  push:
    paths:
      - "engine/**"
      - "web/**"
      - ".github/workflows/engine.yml"
      - ".github/actions/build/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build, compare with native llmfit, make the page
        uses: ./.github/actions/build

      - name: Keep the page
        uses: actions/upload-artifact@v4
        with:
          name: tensortailor-html
          path: dist/tensortailor.html
          retention-days: 30

      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-wasm
          path: |
            engine/pkg-web
            engine/pkg-nomod
            engine/Cargo.lock
          retention-days: 14
