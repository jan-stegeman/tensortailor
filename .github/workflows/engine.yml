name: Engine (WebAssembly)

on:
  push:
    paths:
      - "engine/**"
      - "web/**"
      - ".github/workflows/engine.yml"
      - ".github/actions/build/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, compare with native llmfit, make the page
        uses: ./.github/actions/build

      - name: Keep the page
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tensortailor-html
          path: |
            dist/tensortailor.html
            dist/THIRD-PARTY-NOTICES.txt
          retention-days: 30

      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-wasm
          path: |
            engine/pkg-web
            engine/pkg-nomod
            engine/Cargo.lock
          retention-days: 14
